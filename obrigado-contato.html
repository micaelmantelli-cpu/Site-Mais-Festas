<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Recebemos seus dados | Mais Festas</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--carvao:#0F0D0A;--brasa:#1A1510;--linha:#2E261C;--ouro:#FFC52A;--texto:#F6F1E7;--suave:#A99F8E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(60% 50% at 50% 0%,#2a1d0c 0%,transparent 70%),var(--carvao);color:var(--texto);font:400 1.0625rem/1.65 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:20px clamp(20px,5vw,72px);border-bottom:1px solid var(--linha)}
header img{height:42px;width:auto;display:block}
main{max-width:640px;margin:0 auto;padding:clamp(48px,9vw,96px) 20px 80px;text-align:center}
.ok{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--ouro);margin-bottom:24px}
.ok::after{content:"";width:16px;height:30px;border:solid #1a1200;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-2px,-4px)}
h1{font-weight:800;letter-spacing:-.025em;line-height:1.1;font-size:clamp(2rem,6vw,3rem);margin:0 0 16px}
p{color:#d9d1c2;margin:0 auto 14px;max-width:52ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:999px;font-weight:800;text-decoration:none;margin-top:18px}
.btn-zap{background:#25D366;color:#06210f}
.btn-borda{border:2px solid var(--linha);color:var(--texto)}
.video{margin:32px auto 0;width:min(100%,320px);aspect-ratio:9/16;border-radius:24px;overflow:hidden;border:1px solid var(--linha);background:#000}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.passos{list-style:none;padding:0;margin:28px auto 0;display:grid;gap:12px;text-align:left;max-width:440px}
.passos li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--linha);border-radius:14px;background:var(--brasa)}
.passos b{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--ouro);color:#1a1200;font-size:.85rem}
.etapa{display:inline-block;color:var(--ouro);font-weight:800;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.btn-zap{min-height:64px;padding:0 32px;font-size:1.1rem;box-shadow:0 12px 32px -8px rgba(37,211,102,.55);animation:pulsa 2s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 12px 40px -4px rgba(37,211,102,.85)}}
@media(prefers-reduced-motion:reduce){.btn-zap{animation:none}}
.nota{font-size:.88rem;color:var(--suave);margin-top:10px}
.passos li.agora{border-color:#25D366}
.passos li.agora b{background:#25D366;color:#06210f}
.passos small{display:block;color:#25D366;font-weight:800;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
footer{text-align:center;color:var(--suave);font-size:.85rem;padding:0 20px 40px}
</style>

</head>
<body data-abertura="Acabei de preencher o formulário no site da Mais Festas e quero saber o melhor caminho para o meu negócio.">
<header><a href="./"><img src="assets/logo.webp" alt="Mais Festas" width="55" height="42"></a></header>
<main>
  <span class="etapa">Último passo</span>
  <h1>Falta só um passo</h1>
  <p>Envie a mensagem no nosso WhatsApp para a equipe da Mais Festas analisar o seu negócio e indicar o melhor caminho para o seu momento.</p>
  <a class="btn btn-zap" data-zap href="https://wa.me/5517991831471" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" width="26" height="26"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.37A9.9 9.9 0 1 0 12.04 2Zm4.44 12.03c-.24-.12-1.44-.71-1.66-.79-.22-.08-.39-.12-.55.12-.16.24-.63.79-.77.95-.14.16-.28.18-.52.06-.24-.12-1.03-.38-1.96-1.21-.72-.65-1.21-1.45-1.35-1.69-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.75-1.81-.2-.47-.4-.41-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.16 1.51.1.46-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28Z"/></svg>Enviar mensagem no WhatsApp</a>

</main>
<footer>© 2026 Mais Festas · CNPJ 69.536.229/0001-41</footer>
<script>
// monta a mensagem do WhatsApp com o nome e o Instagram preenchidos no formulário
(function () {
  let lead = {};
  try { lead = JSON.parse(sessionStorage.getItem("mf_lead")) || {}; } catch (e) {}
  const partes = ["Olá! __ABERTURA__"];
  if (lead.nome) partes.push("Meu nome é " + lead.nome + (lead.instagram ? " (" + lead.instagram + ")" : "") + ".");
  const msg = partes.join(" ").replace("__ABERTURA__", document.body.dataset.abertura);
  document.querySelectorAll("[data-zap]").forEach(a => a.href = "https://wa.me/5517991831471?text=" + encodeURIComponent(msg));
})();
</script>
